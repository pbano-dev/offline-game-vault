name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "src:tools"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Reject tracked generated or temporary files
        run: python -B tools/check_repository_hygiene.py --tracked

      - name: Install validator dependency
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r requirements-ci.txt

      - name: Validate repository metadata
        run: python -B tools/validate_repository.py

      - name: Audit public paths and symlink targets
        run: python -B tools/check_public_privacy.py

      - name: Check Python syntax for matrix version
        shell: bash
        run: |
          python - <<'PYTHON_SYNTAX'
          from pathlib import Path

          paths = sorted(
              path
              for root in ("src", "tests", "tools")
              for path in Path(root).rglob("*.py")
          )

          for path in paths:
              compile(path.read_bytes(), str(path), "exec")

          print(f"PYTHON SYNTAX CHECK PASSED: {len(paths)} files")
          PYTHON_SYNTAX

      - name: Run unit tests without writing bytecode
        run: python -B -m unittest discover -s tests -v

      - name: Reject files generated during CI
        run: python -B tools/check_repository_hygiene.py --filesystem
